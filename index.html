<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bento Grid</title>
<style>
  :root {
    --bg: #14141c;
    --box-bg: #ffffff;
    --box-border: #0a0a0a;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100%;
  }
  .bento {
    width: 100%;
    max-width: 1100px;
    aspect-ratio: 2053 / 1497;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    grid-template-areas:
      "a b c d"
      "a f f d"
      "e f f g"
      "h h i g";
    gap: var(--gap);
  }
  .box {
    background: var(--box-bg);
    border: 3px solid var(--box-border);
    border-radius: 14px;
  }
  .a { grid-area: a; }
  .b { grid-area: b; }
  .c { grid-area: c; }
  .d { grid-area: d; }
  .e { grid-area: e; }
  .f { grid-area: f; }
  .g { grid-area: g; }
  .h { grid-area: h; }
  .i { grid-area: i; }

  @media (max-width: 640px) {
    .bento {
      aspect-ratio: auto;
      grid-template-areas:
        "a a b b"
        "a a c c"
        "d d d d"
        "e e f f"
        "g g f f"
        "h h h i";
      grid-template-rows: repeat(6, minmax(90px, auto));
    }
  }
</style>
</head>
<body>
  <div class="bento">
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box c"></div>
    <div class="box d"></div>
    <div class="box e"></div>
    <div class="box f"></div>
    <div class="box g"></div>
    <div class="box h"></div>
    <div class="box i"></div>
  </div>
</body>
</html>
